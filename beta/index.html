<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c39bb" />
  <title>Yosan</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #eef4fd; color: #17233f; text-align: center; padding: 24px; line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f1830; color: #e8eefc; } .sub { color: #9fb2d8 !important; } }
    .card { max-width: 440px; }
    .mark { font-weight: 800; font-size: 40px; letter-spacing: -0.02em; color: #1c39bb; margin-bottom: 14px; }
    h1 { font-size: 24px; margin: 0 0 12px; font-weight: 800; }
    p { margin: 8px 0; }
    .sub { color: #4a5674; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">¥osan</div>
    <h1>This app is offline right now</h1>
    <p class="sub">Yosan has been taken offline for the moment. It may be back later.</p>
    <p class="sub">Your budget data is safe on your own device — nothing has been deleted.</p>
  </div>
  <script>
    // Kill any previously-installed service worker + clear its cached app,
    // so this offline page replaces the old PWA on this device.
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      }
      if (window.caches && caches.keys) { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); }
    } catch (e) {}
  </script>
</body>
</html>
